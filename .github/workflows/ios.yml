name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      GX_TEAM_ID: ${{ secrets.GX_TEAM_ID }}
      GX_BUNDLE_ID: ${{ secrets.GX_BUNDLE_ID || 'com.githubactions.generalszh' }}
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkg-config xcodegen autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '533a5fda5c0646d1771345fb572e759283444d5f'

      - name: Show Xcode info
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Fetch MoltenVK
        env:
          GX_MOLTENVK_ROOT: ${{ github.workspace }}/MoltenVK
        run: ./scripts/build/ios/fetch-moltenvk.sh

      - name: Prepare MoltenVK SDK layout
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/MoltenVK/MoltenVK"
          static="$root/static/MoltenVK.xcframework/ios-arm64"
          test -f "$static/libMoltenVK.a"
          mkdir -p "$root/lib" "$root/include"
          cp "$static/libMoltenVK.a" "$root/lib/"
          cp -R "$root/include/"* "$root/include/" 2>/dev/null || true
          echo "VULKAN_SDK=$root" >> "$GITHUB_ENV"

      - name: Stage fonts
        run: ./scripts/build/ios/stage-fonts.sh

      - name: Use runner-compatible FFmpeg port
        run: |
          rm -f vcpkg-lock.json
          jq 'del(.overrides)' vcpkg.json > vcpkg.json.tmp
          mv vcpkg.json.tmp vcpkg.json

      - name: Configure iOS build
        run: cmake --preset ios-vulkan

      - name: Build engine
        run: cmake --build build/ios-vulkan --target z_generals

      - name: Package iOS app
        if: ${{ env.GX_TEAM_ID != '' }}
        run: |
          echo "Signing enabled..."
          ./scripts/build/ios/package-ios-zh.sh --dev

      - name: Warning if signing missing
        if: ${{ env.GX_TEAM_ID == '' }}
        run: |
          echo "::warning::Missing GX_TEAM_ID. Without Apple Developer credentials, signed IPA will not be produced."
          echo "Add secrets: GX_TEAM_ID and optionally GX_BUNDLE_ID"

      - name: Package unsigned development IPA
        if: ${{ env.GX_TEAM_ID == '' }}
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate --quiet
          xcodebuild -project GeneralsXZH.xcodeproj \
            -scheme GeneralsXZH -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p ../build/ios-package
          cp -R build/Build/Products/Release-iphoneos/GeneralsXZH.app ../build/ios-package/
          cp ../build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH \
            ../build/ios-package/GeneralsXZH.app/GeneralsXZH
          mkdir -p ../build/ios-package/GeneralsXZH.app/Frameworks
          for lib in \
            ../build/ios-vulkan/_deps/dxvk-build-macos/src/d3d8/libdxvk_d3d8.0.dylib \
            ../build/ios-vulkan/_deps/dxvk-build-macos/src/d3d9/libdxvk_d3d9.0.dylib \
            ../build/ios-vulkan/_deps/sdl3-build/libSDL3.0.dylib \
            ../build/ios-vulkan/_deps/sdl3_image-build/libSDL3_image.0.dylib \
            ../build/ios-vulkan/_deps/openal_soft-build/libopenal.1.24.2.dylib; do
            test -f "$lib" && cp "$lib" ../build/ios-package/GeneralsXZH.app/Frameworks/
          done
          cp -R ../MoltenVK/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework \
            ../build/ios-package/GeneralsXZH.app/Frameworks/
          install_name_tool -add_rpath "@executable_path/Frameworks" \
            ../build/ios-package/GeneralsXZH.app/GeneralsXZH || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string GeneralsXZH" \
            ../build/ios-package/GeneralsXZH.app/Info.plist || true
          mkdir -p ../build/unsigned-payload/Payload
          cp -R ../build/ios-package/GeneralsXZH.app ../build/unsigned-payload/Payload/
          (cd ../build/unsigned-payload && zip -qry ../GeneralsXZH-unsigned.ipa Payload)

      - name: Show generated files
        run: |
          echo "== .ipa =="
          find . -type f -name "*.ipa" -print || true
          echo "== .app =="
          find . -type d -name "*.app" -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generals-iOS-build-artifacts
          path: |
            **/*.ipa
            **/*.app
            build/ios-vulkan/**
          if-no-files-found: warn
